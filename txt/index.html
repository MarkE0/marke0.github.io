<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Text Utilities</title>
    <style>
      body {
        font-family: Arial;
        margin: 20px;
      }
      textarea {
        width: 100%;
        height: 200px;
      }
      .inputs {
        display: flex;
        gap: 20px;
      }
      .column {
        width: 50%;
      }
      .diff-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .diff-box {
        width: 50%;
        border: 1px solid #ccc;
        padding: 10px;
        white-space: pre-wrap;
        font-family: monospace;
      }
      .removed {
        background-color: #f7c5c5;
      } /* red */
      .added {
        background-color: #c8f7c5;
      } /* green */
    </style>
